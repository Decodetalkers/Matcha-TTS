[project]
name = "matcha-tts"
version = "1.0.0"
description = "matcha tts"
requires-python = ">=3.12"
dependencies = [
    "conformer>=0.3.2",
    "diffusers>=0.40.0",
    "einops>=0.8.2",
    "gdown>=6.4.0",
    "gradio>=6.26.0",
    "hydra-core>=1.3.6",
    "inflect>=7.5.0",
    "librosa>=1.0.0",
    "lightning>=2.6.5",
    "matplotlib>=3.11.1",
    "omegaconf>=2.3.1",
    "onnxruntime>=1.29.0",
    "phonemizer>=3.4.0",
    "rich>=15.0.0",
    "rootutils>=1.0.7",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.28.0",
    "unidecode>=1.4.0",
    "wandb>=0.30.0",
]

[tool.black]
line-length = 120
target-version = ['py310']
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "ipython>=9.17.0",
]
